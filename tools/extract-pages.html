.pfa-home-link,.pfa-search-toggle{border:1px solid var(--border);background:#fff;color:var(--text);text-decoration:none;border-radius:999px;padding:.48rem .8rem;font:600 .82rem inherit;cursor:pointer}

.pfa-search-panel{display:none;position:absolute;right:0;top:calc(100% + .6rem);width:min( min(360px, calc(100vw - 2rem)), 360px);background:#fff;border:1px solid var(--border);border-radius:14px;padding:.8rem;box-shadow:0 16px 40px rgba(15,23,42,.16);z-index:100}
.pfa-search-panel.open{display:block}
.pfa-search-input{width:100%;padding:.7rem .8rem;border:1px solid var(--border);border-radius:9px;font:inherit;outline-color:var(--primary);color:var(--text)}

.pfa-support-nudge{max-width:820px;width:calc(100% - 2rem);margin:0 auto 2rem;padding:.85rem 1rem;border:1px solid rgba(124,58,237,.15);background:rgba(244,241,254,.72);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:1rem;color:var(--text);font-size:.88rem}
.pfa-support-nudge a{white-space:nowrap;text-decoration:none;font-weight:700;color:var(--primary)}
.pfa-change-file{display:none;margin:.75rem 0 0;padding:.55rem .9rem;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--primary);font:600 .85rem inherit;cursor:pointer}
.pfa-change-file.visible{display:inline-flex}.pfa-change-group{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}.pfa-change-group .pfa-change-file{margin:0}
@media(max-width:640px){.header-inner{gap:.6rem;padding:.75rem 1rem}.pfa-nav-tools{gap:.3rem}.pfa-home-link,.pfa-search-toggle{font-size:.76rem;padding:.42rem .6rem}.pfa-support-nudge{align-items:flex-start;flex-direction:column}}

<body>
<header>
  <div class="header-inner">
    <a href="../index.html" class="logo" style="text-decoration:none; display:flex; align-items:center; gap:0.5rem;">
        <img src="../logo.webp" alt="PDFforAll Logo" width="32" height="32" style="display:block; object-fit:contain; border-radius:6px;">
        <span>PDF<span style="color:var(--primary);">for</span>All</span>
      </a>
    <div class="header-nav"><div style="display:flex;gap:0.5rem;align-items:center;"><a href="../support.html" class="btn-support" style="text-decoration:none;"><span>💖</span> Support</a><a href="../index.html" class="btn-back">← All Tools</a></div></div>
  </div>

<section class="tool-hero">
  <div class="tool-icon-large">📤</div>
  <h1>Extract Pages</h1>
  <p>Select specific pages visually and extract them into a new PDF file.</p>
</section>

<div class="tool-workspace">
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".pdf">
    <div class="drop-zone-icon">📄</div>
    <h3>Drop a PDF file here</h3>
    <p>or click to browse</p>
    <button class="btn-browse" onclick="document.getElementById('fileInput').click()">Browse File</button>
  </div>

  <div id="controls" style="display:none;margin-top:1.5rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
      <span id="selInfo" style="font-size:0.85rem;color:var(--text-muted);">Click pages to select for extraction</span>
      <div style="display:flex;gap:0.5rem;">
        <input type="text" id="quickRange" placeholder="e.g. 1-3, 5" style="min-width:140px;font-size:0.82rem;padding:0.4rem 0.75rem;">
        <button onclick="applyRange()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:0.4rem 0.8rem;border-radius:8px;cursor:pointer;font-size:0.8rem;font-family:inherit;">Apply</button>
      </div>
    </div>
    <div class="page-grid" id="pageGrid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));"></div>
    <button class="btn-action" id="extractBtn" style="margin-top:1.5rem;" disabled>📤 Extract Selected Pages</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <p class="progress-text" id="progressText">Processing…</p>
  </div>
  <div class="result-box" id="resultBox">
    <div class="result-success">
      <span class="result-success-icon">✅</span>
      <div class="result-success-text"><h4>Pages extracted!</h4><p id="resultInfo"></p></div>
    </div>
    <a class="btn-download" id="downloadBtn" href="#" download="extracted.pdf">⬇️ Download extracted.pdf</a>
  </div>
  <div class="error-box" id="errorBox"></div>
</div>

<footer class="tool-footer"><p>PDFforAll.in · <a href="../index.html">All Tools</a></p></footer>

<style>
.page-thumb.selected-extract{border-color:var(--gold);background:rgba(201,168,76,0.08);}
.page-thumb.selected-extract .page-thumb-label{background:var(--gold);color:#000;}
</style>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfFile=null,pdfDoc=null,totalPages=0,selected=new Set();
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
const progressWrap=document.getElementById('progressWrap'),progressFill=document.getElementById('progressFill'),progressText=document.getElementById('progressText');
const resultBox=document.getElementById('resultBox'),downloadBtn=document.getElementById('downloadBtn'),errorBox=document.getElementById('errorBox');

async function loadFile(file){
  if(!file.name.toLowerCase().endsWith('.pdf')){showError('Please select a PDF file.');return;}
  pdfFile=file;hideError();resultBox.classList.remove('visible');selected.clear();
  const ab=await file.arrayBuffer();
  pdfDoc=await pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise;
  totalPages=pdfDoc.numPages;
  dropZone.style.display='none';document.getElementById('controls').style.display='block';
  await renderGrid();
}

async function renderGrid(){
  const grid=document.getElementById('pageGrid');grid.innerHTML='';
  for(let i=1;i<=totalPages;i++){
    const page=await pdfDoc.getPage(i);
    const vp=page.getViewport({scale:0.5});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    const thumb=document.createElement('div');thumb.className='page-thumb'+(selected.has(i)?' selected-extract':'');
    thumb.dataset.page=i;
    const lbl=document.createElement('div');lbl.className='page-thumb-label';lbl.textContent='Page '+i;
    thumb.appendChild(cv);thumb.appendChild(lbl);
    thumb.addEventListener('click',()=>toggleSel(i,thumb));
    grid.appendChild(thumb);
  }
  updateBtn();
}

function toggleSel(n,el){
  if(selected.has(n)){selected.delete(n);el.classList.remove('selected-extract');}
  else{selected.add(n);el.classList.add('selected-extract');}
  updateBtn();
}

function updateBtn(){
  const n=selected.size;
  document.getElementById('selInfo').textContent=n>0?`${n} page${n!==1?'s':''} selected`:'Click pages to select for extraction';
  document.getElementById('extractBtn').disabled=n===0;
}

function applyRange(){
  const str=document.getElementById('quickRange').value;
  selected.clear();
  str.split(',').forEach(p=>{p=p.trim();if(p.includes('-')){const[a,b]=p.split('-').map(Number);for(let i=a;i<=Math.min(b,totalPages);i++)selected.add(i);}else{const n=Number(p);if(n>=1&&n<=totalPages)selected.add(n);}});
  document.querySelectorAll('.page-thumb').forEach(t=>{const pg=parseInt(t.dataset.page);t.classList.toggle('selected-extract',selected.has(pg));const lbl=t.querySelector('.page-thumb-label');if(lbl)lbl.style.background=selected.has(pg)?'var(--gold)':'';if(lbl)lbl.style.color=selected.has(pg)?'#000':'';});
  updateBtn();
}

document.getElementById('extractBtn').addEventListener('click',async()=>{
  if(!pdfFile||!selected.size)return;hideError();showProgress(10,'Loading PDF…');
  try{
    const ab=await pdfFile.arrayBuffer();
    const srcDoc=await PDFLib.PDFDocument.load(ab);
    const newDoc=await PDFLib.PDFDocument.create();
    const pages=[...selected].sort((a,b)=>a-b);
    setProgress(50,'Extracting…');
    const copied=await newDoc.copyPages(srcDoc,pages.map(p=>p-1));
    copied.forEach(p=>newDoc.addPage(p));
    setProgress(90,'Saving…');
    const bytes=await newDoc.save({useObjectStreams:true});
    const blob=new Blob([bytes],{type:'application/pdf'});
    downloadBtn.href=URL.createObjectURL(blob);
    document.getElementById('resultInfo').textContent=`${pages.length} pages extracted`;
    setProgress(100,'Done!');
    setTimeout(()=>{progressWrap.classList.remove('visible');resultBox.classList.add('visible');},400);
  }catch(e){showError('Error: '+e.message);progressWrap.classList.remove('visible');}
});

dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag-over');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag-over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])loadFile(fileInput.files[0]);fileInput.value='';});

function showProgress(pct,txt){progressWrap.classList.add('visible');resultBox.classList.remove('visible');setProgress(pct,txt);}
function setProgress(pct,txt){progressFill.style.width=pct+'%';progressText.textContent=txt;}
function showError(msg){errorBox.textContent=msg;errorBox.classList.add('visible');}
function hideError(){errorBox.classList.remove('visible');}
</script>

<script id="pdfforall-upgrade-script">
(function(){
  const toolList = [{"name": "Compare PDFs", "url": "compare.html", "icon": "⚖️"}, {"name": "Compress PDF", "url": "compress.html", "icon": "🗜️"}, {"name": "Crop PDF", "url": "crop.html", "icon": "✂️"}, {"name": "Extract Pages", "url": "extract-pages.html", "icon": "📤"}, {"name": "Flatten PDF", "url": "flatten.html", "icon": "📄"}, {"name": "Grayscale PDF", "url": "grayscale.html", "icon": "⚫"}, {"name": "HTML to PDF", "url": "html-to-pdf.html", "icon": "🌐"}, {"name": "Image to PDF", "url": "images-to-pdf.html", "icon": "🖼️"}, {"name": "Merge PDF", "url": "merge.html", "icon": "🔗"}, {"name": "Page Numbers", "url": "page-numbers.html", "icon": "🔢"}, {"name": "PDF Info", "url": "pdf-info.html", "icon": "ℹ️"}, {"name": "PDF to HTML", "url": "pdf-to-html.html", "icon": "🌐"}, {"name": "PDF to Images", "url": "pdf-to-images.html", "icon": "🖼️"}, {"name": "PDF to Text", "url": "pdf-to-text.html", "icon": "📋"}, {"name": "Protect PDF", "url": "protect.html", "icon": "🔒"}, {"name": "Redact PDF", "url": "redact.html", "icon": "🖍️"}, {"name": "Remove Pages", "url": "remove-pages.html", "icon": "🗑️"}, {"name": "Reorder Pages", "url": "reorder.html", "icon": "↕️"}, {"name": "Repair PDF", "url": "repair.html", "icon": "🛠️"}, {"name": "Rotate PDF", "url": "rotate.html", "icon": "🔄"}, {"name": "Sign PDF", "url": "sign.html", "icon": "✍️"}, {"name": "Split PDF", "url": "split.html", "icon": "✂️"}, {"name": "Stamp PDF", "url": "stamp.html", "icon": "🔖"}, {"name": "SVG to PDF", "url": "svg-to-pdf.html", "icon": "🎨"}, {"name": "Text to PDF", "url": "text-to-pdf.html", "icon": "📝"}, {"name": "Unlock PDF", "url": "unlock.html", "icon": "🔓"}, {"name": "Watermark PDF", "url": "watermark.html", "icon": "💧"}];
  const currentFile = location.pathname.split('/').pop();
  const headerNav = document.querySelector('.header-nav');
  if(headerNav && !document.getElementById('pfaNavTools')){
    const nav=document.createElement('div');
    nav.id='pfaNavTools'; nav.className='pfa-nav-tools';
    nav.innerHTML='<a class="pfa-home-link" href="../index.html" aria-label="Go to homepage">⌂ Home</a><div class="pfa-search-wrap"><button type="button" class="pfa-search-toggle" id="pfaSearchToggle" aria-expanded="false">⌕ Find tools</button><div class="pfa-search-panel" id="pfaSearchPanel"><input class="pfa-search-input" id="pfaSearchInput" type="search" placeholder="Search PDF tools…" autocomplete="off" aria-label="Search PDF tools"><div class="pfa-search-results" id="pfaSearchResults"></div></div></div>';
    headerNav.appendChild(nav);
    const panel=nav.querySelector('#pfaSearchPanel'), input=nav.querySelector('#pfaSearchInput'), results=nav.querySelector('#pfaSearchResults'), toggle=nav.querySelector('#pfaSearchToggle');
    function render(){
      const q=input.value.trim().toLowerCase();
      const matches=toolList.filter(t=>t.name.toLowerCase().includes(q) && t.url!==currentFile);
      results.innerHTML='';
      if(!matches.length){results.textContent='No matching tools found.';return;}
      matches.forEach(t=>{
        const a=document.createElement('a'); a.href=t.url; a.textContent=t.icon+' '+t.name; results.appendChild(a);
      });
    }
    toggle.addEventListener('click',()=>{const open=!panel.classList.contains('open');panel.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));if(open){render();input.focus();}});
    input.addEventListener('input',render);
    document.addEventListener('click',e=>{if(!nav.contains(e.target)){panel.classList.remove('open');toggle.setAttribute('aria-expanded','false');}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){panel.classList.remove('open');toggle.setAttribute('aria-expanded','false');}});
  }
  // Offer a lightweight support prompt on every tool page.
  if(!document.querySelector('.pfa-support-nudge')){
    const nudge=document.createElement('aside');nudge.className='pfa-support-nudge';
    nudge.innerHTML='<span>💜 Like our free PDF tools? Your support helps us keep improving PDFforAll.</span><a href="../support.html">Support our work →</a>';
    const footer=document.querySelector('footer');
    if(footer) footer.parentNode.insertBefore(nudge,footer);
  }
  // Persistent file-replacement controls. Trigger the tool's original input
  // directly so its existing change handler performs the normal reset/reload.
  const fileInputs=[...document.querySelectorAll('input[type="file"]')].filter(input=>{
    const accept=(input.getAttribute('accept')||'').toLowerCase();
    return input.id!=='signatureFileInput' && (accept.includes('.pdf') || accept.includes('image/'));
  });
  const navTools=document.getElementById('pfaNavTools');
  if(navTools && fileInputs.length){
    const changeGroup=document.createElement('div');
    changeGroup.className='pfa-change-group';
    fileInputs.forEach((input,index)=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='pfa-change-file visible';
      button.textContent=input.multiple
        ? (input.accept.toLowerCase().includes('.pdf')?'↻ Change PDFs':'↻ Change Images')
        : (fileInputs.length>1?`↻ Change PDF ${index+1}`:'↻ Change PDF');
      button.setAttribute('aria-label',button.textContent.replace('↻ ',''));
      button.addEventListener('click',()=>{input.value='';input.click();});
      changeGroup.appendChild(button);
    });
    navTools.appendChild(changeGroup);
  }
})();
</script>
