<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Text — PDFforAll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tool.css">
  <link rel="icon" href="../favicon.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="../index.html" class="logo" style="text-decoration:none; display:flex; align-items:center; gap:0.5rem;">
        <img src="../logo.png" alt="PDFforAll Logo" width="32" height="32" style="display:block; object-fit:contain; border-radius:6px;">
        <span>PDF<span style="color:var(--primary);">for</span>All</span>
      </a>
    <div class="header-nav"><div style="display:flex;gap:0.5rem;align-items:center;"><a href="../support.html" class="btn-support" style="text-decoration:none;"><span>💖</span> Support</a><a href="../index.html" class="btn-back">← All Tools</a></div></div>
  </div>
</header>

<section class="tool-hero">
  <div class="tool-icon-large">📋</div>
  <h1>PDF to Text</h1>
  <p>Extract all text content from a PDF document. Copy or download as a .txt file.</p>
</section>

<div class="tool-workspace">
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".pdf">
    <div class="drop-zone-icon">📄</div>
    <h3>Drop a PDF file here</h3>
    <p>or click to browse</p>
    <button class="btn-browse" onclick="document.getElementById('fileInput').click()">Browse File</button>
  </div>

  <div id="controls" style="display:none;">
    <div class="options-panel" style="margin-top:1.5rem;">
      <h3>Extraction Options</h3>
      <div class="option-row">
        <div><div class="option-label">Pages</div></div>
        <select id="pageMode">
          <option value="all">All pages</option>
          <option value="range">Custom range</option>
        </select>
      </div>
      <div class="option-row" id="rangeRow" style="display:none;">
        <div><div class="option-label">Page Range</div><div class="option-hint">e.g. 1-3, 5</div></div>
        <input type="text" id="rangeInput" placeholder="1-3, 5">
      </div>
      <div class="option-row">
        <div><div class="option-label">Include Page Separators</div></div>
        <input type="checkbox" id="pageSep" checked>
      </div>
    </div>
    <button class="btn-action" id="extractBtn">📋 Extract Text</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <p class="progress-text" id="progressText">Extracting…</p>
  </div>

  <div id="textResult" style="display:none;margin-top:1.5rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
      <span id="wordCount" style="font-size:0.82rem;color:var(--text-muted);"></span>
      <div style="display:flex;gap:0.5rem;">
        <button id="copyBtn" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:0.45rem 0.9rem;border-radius:8px;cursor:pointer;font-size:0.82rem;font-family:inherit;">📋 Copy</button>
        <button id="downloadTxtBtn" style="background:var(--surface2);border:1px solid var(--gold);color:var(--gold);padding:0.45rem 0.9rem;border-radius:8px;cursor:pointer;font-size:0.82rem;font-family:inherit;">⬇️ Download .txt</button>
      </div>
    </div>
    <textarea id="textArea" readonly style="width:100%;height:400px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Courier New',monospace;font-size:0.82rem;line-height:1.6;padding:1rem;border-radius:12px;resize:vertical;outline:none;"></textarea>
  </div>
  <div class="error-box" id="errorBox"></div>
</div>

<footer class="tool-footer"><p>PDFforAll.in · <a href="../index.html">All Tools</a></p></footer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfFile=null,pdfDoc=null;
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
const progressWrap=document.getElementById('progressWrap'),progressFill=document.getElementById('progressFill'),progressText=document.getElementById('progressText');
const errorBox=document.getElementById('errorBox'),textArea=document.getElementById('textArea');

document.getElementById('pageMode').addEventListener('change',function(){
  document.getElementById('rangeRow').style.display=this.value==='range'?'flex':'none';
});

function parseRange(str,max){
  const pages=new Set();
  str.split(',').forEach(p=>{p=p.trim();if(p.includes('-')){const[a,b]=p.split('-').map(Number);for(let i=a;i<=Math.min(b,max);i++)pages.add(i);}else{const n=Number(p);if(n>=1&&n<=max)pages.add(n);}});
  return [...pages];
}

async function loadFile(file){
  if(!file.name.toLowerCase().endsWith('.pdf')){showError('Please select a PDF file.');return;}
  pdfFile=file;hideError();document.getElementById('textResult').style.display='none';
  const ab=await file.arrayBuffer();
  pdfDoc=await pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise;
  dropZone.style.display='none';document.getElementById('controls').style.display='block';
}

dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag-over');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag-over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])loadFile(fileInput.files[0]);fileInput.value='';});

document.getElementById('extractBtn').addEventListener('click',async()=>{
  if(!pdfDoc)return;hideError();progressWrap.classList.add('visible');document.getElementById('textResult').style.display='none';
  const n=pdfDoc.numPages;
  const sep=document.getElementById('pageSep').checked;
  let pages=document.getElementById('pageMode').value==='range'
    ?parseRange(document.getElementById('rangeInput').value,n)
    :[...Array(n)].map((_,i)=>i+1);
  let result='';
  for(let pi=0;pi<pages.length;pi++){
    setProgress(Math.round((pi/pages.length)*95),`Processing page ${pages[pi]}/${n}…`);
    const page=await pdfDoc.getPage(pages[pi]);
    const content=await page.getTextContent();
    const pageText=content.items.map(i=>i.str).join(' ');
    if(sep) result+=`\n\n─── Page ${pages[pi]} ───\n\n`;
    result+=pageText;
  }
  setProgress(100,'Done!');
  setTimeout(()=>{
    progressWrap.classList.remove('visible');
    textArea.value=result.trim();
    const words=result.trim().split(/\s+/).filter(Boolean).length;
    const chars=result.trim().length;
    document.getElementById('wordCount').textContent=`${words.toLocaleString()} words · ${chars.toLocaleString()} characters · ${pages.length} pages`;
    document.getElementById('textResult').style.display='block';
  },400);
});

document.getElementById('copyBtn').addEventListener('click',async()=>{
  await navigator.clipboard.writeText(textArea.value);
  const btn=document.getElementById('copyBtn');btn.textContent='✅ Copied!';setTimeout(()=>btn.textContent='📋 Copy',2000);
});

document.getElementById('downloadTxtBtn').addEventListener('click',()=>{
  const blob=new Blob([textArea.value],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(pdfFile?.name||'document').replace('.pdf','')+'.txt';a.click();
});

function setProgress(pct,txt){progressFill.style.width=pct+'%';progressText.textContent=txt;}
function showError(msg){errorBox.textContent=msg;errorBox.classList.add('visible');}
function hideError(){errorBox.classList.remove('visible');}
</script>
</body>
</html>
