<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to PDF — PDFforAll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tool.css">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="../index.html" class="logo">PDF<span>for</span>All</a>
    <div class="header-nav"><a href="../index.html" class="btn-back">← All Tools</a></div>
  </div>
</header>

<section class="tool-hero">
  <div class="tool-icon-large">📝</div>
  <h1>Text to PDF</h1>
  <p>Type or paste plain text and convert it to a clean, formatted PDF document.</p>
</section>

<div class="tool-workspace">
  <div style="margin-bottom:1.5rem;">
    <textarea id="textInput" placeholder="Type or paste your text here…&#10;&#10;The text will be automatically wrapped and paginated in the PDF." style="width:100%;height:260px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Courier New',monospace;font-size:0.9rem;line-height:1.7;padding:1rem;border-radius:12px;resize:vertical;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='var(--border)'"></textarea>
    <div style="font-size:0.75rem;color:var(--text-muted);text-align:right;margin-top:0.3rem;" id="charCount">0 characters</div>
  </div>

  <div class="options-panel">
    <h3>PDF Style</h3>
    <div class="option-row">
      <div><div class="option-label">Page Size</div></div>
      <select id="pageSize">
        <option value="A4">A4</option>
        <option value="Letter">Letter</option>
        <option value="A5">A5</option>
      </select>
    </div>
    <div class="option-row">
      <div><div class="option-label">Font</div></div>
      <select id="font">
        <option value="Helvetica">Helvetica (Sans)</option>
        <option value="TimesRoman">Times Roman (Serif)</option>
        <option value="Courier">Courier (Mono)</option>
      </select>
    </div>
    <div class="option-row">
      <div><div class="option-label">Font Size</div></div>
      <input type="number" id="fontSize" value="11" min="6" max="24" style="min-width:80px;">
    </div>
    <div class="option-row">
      <div><div class="option-label">Line Spacing</div></div>
      <select id="lineSpacing">
        <option value="1">Single</option>
        <option value="1.5" selected>1.5×</option>
        <option value="2">Double</option>
      </select>
    </div>
    <div class="option-row">
      <div><div class="option-label">Margin</div></div>
      <input type="number" id="margin" value="50" min="20" max="100" style="min-width:80px;">
      <span style="font-size:0.8rem;color:var(--text-muted);">pt</span>
    </div>
    <div class="option-row">
      <div><div class="option-label">Filename</div></div>
      <input type="text" id="filename" value="document" style="min-width:160px;">
    </div>
  </div>

  <button class="btn-action" id="convertBtn">📝 Convert to PDF</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <p class="progress-text" id="progressText">Building PDF…</p>
  </div>
  <div class="result-box" id="resultBox">
    <div class="result-success">
      <span class="result-success-icon">✅</span>
      <div class="result-success-text"><h4>PDF created!</h4><p id="resultInfo"></p></div>
    </div>
    <a class="btn-download" id="downloadBtn" href="#" download="document.pdf">⬇️ Download PDF</a>
  </div>
  <div class="error-box" id="errorBox"></div>
</div>

<footer class="tool-footer"><p>PDFforAll.in · <a href="../index.html">All Tools</a></p></footer>

<script>
const PAGE_SIZES={A4:[595.28,841.89],Letter:[612,792],A5:[419.53,595.28]};
const FONTS_MAP={Helvetica:PDFLib.StandardFonts.Helvetica,TimesRoman:PDFLib.StandardFonts.TimesRoman,Courier:PDFLib.StandardFonts.Courier};

const textInput=document.getElementById('textInput');
textInput.addEventListener('input',()=>document.getElementById('charCount').textContent=textInput.value.length.toLocaleString()+' characters');

const progressWrap=document.getElementById('progressWrap'),progressFill=document.getElementById('progressFill'),progressText=document.getElementById('progressText');
const resultBox=document.getElementById('resultBox'),downloadBtn=document.getElementById('downloadBtn'),errorBox=document.getElementById('errorBox');

document.getElementById('convertBtn').addEventListener('click',async()=>{
  const text=textInput.value.trim();
  if(!text){showError('Please enter some text.');return;}
  hideError();progressWrap.classList.add('visible');resultBox.classList.remove('visible');
  setProgress(10,'Creating document…');
  try{
    const szKey=document.getElementById('pageSize').value;
    const[pgW,pgH]=PAGE_SIZES[szKey];
    const fontSize=parseInt(document.getElementById('fontSize').value)||11;
    const margin=parseInt(document.getElementById('margin').value)||50;
    const lineSpacing=parseFloat(document.getElementById('lineSpacing').value)||1.5;
    const lineH=fontSize*lineSpacing;
    const fontKey=document.getElementById('font').value;
    const doc=await PDFLib.PDFDocument.create();
    const font=await doc.embedFont(PDFLib.StandardFonts[fontKey]);
    const maxW=pgW-margin*2;
    const maxH=pgH-margin*2;

    // Word-wrap
    function wrapLine(line){
      const words=line.split(' ');const lines=[];let cur='';
      for(const w of words){
        const test=cur?cur+' '+w:w;
        if(font.widthOfTextAtSize(test,fontSize)>maxW){if(cur)lines.push(cur);cur=w;}else cur=test;
      }
      if(cur)lines.push(cur);
      return lines.length?lines:[''];
    }

    const paragraphs=text.split('\n');
    let allLines=[];
    for(const p of paragraphs){
      if(p.trim()===''){allLines.push('');continue;}
      allLines.push(...wrapLine(p));
    }

    setProgress(50,'Paginating…');
    let page=doc.addPage([pgW,pgH]);
    let y=pgH-margin;let pages=1;

    for(const line of allLines){
      if(y-lineH<margin){page=doc.addPage([pgW,pgH]);y=pgH-margin;pages++;}
      if(line){page.drawText(line,{x:margin,y,size:fontSize,font,color:PDFLib.rgb(0.1,0.1,0.1)});}
      y-=lineH;
    }

    setProgress(90,'Saving…');
    const bytes=await doc.save({useObjectStreams:true});
    const fname=(document.getElementById('filename').value||'document').replace(/\.pdf$/i,'')+'.pdf';
    const blob=new Blob([bytes],{type:'application/pdf'});
    downloadBtn.href=URL.createObjectURL(blob);downloadBtn.download=fname;downloadBtn.textContent='⬇️ Download '+fname;
    document.getElementById('resultInfo').textContent=`${pages} page${pages!==1?'s':''} · ${allLines.length} lines`;
    setProgress(100,'Done!');
    setTimeout(()=>{progressWrap.classList.remove('visible');resultBox.classList.add('visible');},400);
  }catch(e){showError('Error: '+e.message);progressWrap.classList.remove('visible');}
});

function setProgress(pct,txt){progressFill.style.width=pct+'%';progressText.textContent=txt;}
function showError(msg){errorBox.textContent=msg;errorBox.classList.add('visible');}
function hideError(){errorBox.classList.remove('visible');}
</script>
</body>
</html>
