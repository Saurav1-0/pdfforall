<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Images — PDFforAll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tool.css">
  <link rel="icon" href="../favicon.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="../index.html" class="logo" style="text-decoration:none; display:flex; align-items:center; gap:0.5rem;">
        <img src="../logo.png" alt="PDFforAll Logo" width="32" height="32" style="display:block; object-fit:contain; border-radius:6px;">
        <span>PDF<span style="color:var(--primary);">for</span>All</span>
      </a>
    <div class="header-nav"><div style="display:flex;gap:0.5rem;align-items:center;"><a href="../support.html" class="btn-support" style="text-decoration:none;"><span>💖</span> Support</a><a href="../index.html" class="btn-back">← All Tools</a></div></div>
  </div>
</header>

<section class="tool-hero">
  <div class="tool-icon-large">🖼️</div>
  <h1>PDF to Images</h1>
  <p>Convert each PDF page to PNG or JPEG. Download individually or as a ZIP.</p>
</section>

<div class="tool-workspace">
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".pdf">
    <div class="drop-zone-icon">📄</div>
    <h3>Drop a PDF file here</h3>
    <p>or click to browse</p>
    <button class="btn-browse" onclick="document.getElementById('fileInput').click()">Browse File</button>
  </div>

  <div id="controls" style="display:none;">
    <div class="options-panel" style="margin-top:1.5rem;">
      <h3>Output Options</h3>
      <div class="option-row">
        <div><div class="option-label">Format</div></div>
        <select id="format"><option value="image/png">PNG (lossless)</option><option value="image/jpeg">JPEG (smaller)</option></select>
      </div>
      <div class="option-row" id="qualityRow" style="display:none;">
        <div><div class="option-label">JPEG Quality</div><div class="option-hint" id="qualityVal">85%</div></div>
        <input type="range" id="quality" min="40" max="100" value="85" oninput="document.getElementById('qualityVal').textContent=this.value+'%'">
      </div>
      <div class="option-row">
        <div><div class="option-label">Resolution</div></div>
        <select id="scale">
          <option value="1">72 DPI (screen)</option>
          <option value="2" selected>144 DPI (standard)</option>
          <option value="3">216 DPI (high quality)</option>
          <option value="4">288 DPI (print quality)</option>
        </select>
      </div>
      <div class="option-row">
        <div><div class="option-label">Pages</div></div>
        <select id="pageMode">
          <option value="all">All pages</option>
          <option value="range">Custom range</option>
        </select>
      </div>
      <div class="option-row" id="rangeRow" style="display:none;">
        <div><div class="option-label">Page Range</div><div class="option-hint">e.g. 1-3, 5</div></div>
        <input type="text" id="rangeInput" placeholder="1-3, 5">
      </div>
    </div>
    <button class="btn-action" id="convertBtn">🖼️ Convert to Images</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <p class="progress-text" id="progressText">Processing…</p>
  </div>

  <div id="resultsArea" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <span style="font-size:0.85rem;color:var(--text-muted);" id="convertedCount"></span>
      <button class="btn-download" id="downloadAllBtn" style="width:auto;padding:0.6rem 1.2rem;font-size:0.85rem;">⬇️ Download All as ZIP</button>
    </div>
    <div class="page-grid" id="resultsGrid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr));"></div>
  </div>

  <div class="error-box" id="errorBox"></div>
</div>

<footer class="tool-footer"><p>PDFforAll.in · <a href="../index.html">All Tools</a></p></footer>

<style>
.img-result-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
.img-result-card img{width:100%;aspect-ratio:0.707;object-fit:contain;background:#111;}
.img-result-card a{display:block;text-align:center;padding:0.5rem;font-size:0.75rem;color:var(--gold);border-top:1px solid var(--border);text-decoration:none;}
.img-result-card a:hover{background:rgba(201,168,76,0.08);}
</style>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfFile=null,pdfDoc=null,convertedBlobs=[];
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');
const progressWrap=document.getElementById('progressWrap'),progressFill=document.getElementById('progressFill'),progressText=document.getElementById('progressText');
const errorBox=document.getElementById('errorBox');

document.getElementById('format').addEventListener('change',function(){
  document.getElementById('qualityRow').style.display=this.value==='image/jpeg'?'flex':'none';
});
document.getElementById('pageMode').addEventListener('change',function(){
  document.getElementById('rangeRow').style.display=this.value==='range'?'flex':'none';
});

function parseRange(str,max){
  const pages=new Set();
  str.split(',').forEach(p=>{p=p.trim();if(p.includes('-')){const[a,b]=p.split('-').map(Number);for(let i=a;i<=Math.min(b,max);i++)pages.add(i);}else{const n=Number(p);if(n>=1&&n<=max)pages.add(n);}});
  return [...pages];
}

async function loadFile(file){
  if(!file.name.toLowerCase().endsWith('.pdf')){showError('Please select a PDF file.');return;}
  pdfFile=file;hideError();
  const ab=await file.arrayBuffer();
  pdfDoc=await pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise;
  dropZone.style.display='none';document.getElementById('controls').style.display='block';
  document.getElementById('resultsArea').style.display='none';
}

dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag-over');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag-over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])loadFile(fileInput.files[0]);fileInput.value='';});

document.getElementById('convertBtn').addEventListener('click',async()=>{
  if(!pdfDoc){showError('Please load a PDF first.');return;}
  hideError();progressWrap.classList.add('visible');document.getElementById('resultsArea').style.display='none';
  const fmt=document.getElementById('format').value;
  const scale=parseFloat(document.getElementById('scale').value);
  const quality=parseInt(document.getElementById('quality').value)/100;
  const ext=fmt==='image/png'?'png':'jpg';
  const n=pdfDoc.numPages;
  let pages=document.getElementById('pageMode').value==='range'
    ?parseRange(document.getElementById('rangeInput').value,n)
    :[...Array(n)].map((_,i)=>i+1);

  convertedBlobs=[];
  const grid=document.getElementById('resultsGrid');grid.innerHTML='';

  for(let pi=0;pi<pages.length;pi++){
    setProgress(Math.round((pi/pages.length)*95),`Converting page ${pages[pi]} (${pi+1}/${pages.length})…`);
    const page=await pdfDoc.getPage(pages[pi]);
    const vp=page.getViewport({scale});
    const canvas=document.createElement('canvas');
    canvas.width=vp.width;canvas.height=vp.height;
    const ctx=canvas.getContext('2d');
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    const dataURL=canvas.toDataURL(fmt,quality);
    // convert to blob
    const res=await fetch(dataURL);
    const blob=await res.blob();
    convertedBlobs.push({blob,name:`page-${pages[pi]}.${ext}`});
    // show card
    const card=document.createElement('div');card.className='img-result-card';
    const img=document.createElement('img');img.src=dataURL;img.alt=`Page ${pages[pi]}`;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`page-${pages[pi]}.${ext}`;a.textContent=`⬇ Page ${pages[pi]}`;
    card.appendChild(img);card.appendChild(a);grid.appendChild(card);
  }
  setProgress(100,'Done!');
  document.getElementById('convertedCount').textContent=`${pages.length} image${pages.length!==1?'s':''} converted`;
  setTimeout(()=>{progressWrap.classList.remove('visible');document.getElementById('resultsArea').style.display='block';},400);
});

document.getElementById('downloadAllBtn').addEventListener('click',async()=>{
  if(!convertedBlobs.length)return;
  document.getElementById('downloadAllBtn').textContent='Zipping…';
  const zip=new JSZip();
  for(const{blob,name}of convertedBlobs){zip.file(name,blob);}
  const zipBlob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');a.href=URL.createObjectURL(zipBlob);a.download='pdf-images.zip';a.click();
  document.getElementById('downloadAllBtn').textContent='⬇️ Download All as ZIP';
});

function setProgress(pct,txt){progressFill.style.width=pct+'%';progressText.textContent=txt;}
function showError(msg){errorBox.textContent=msg;errorBox.classList.add('visible');}
function hideError(){errorBox.classList.remove('visible');}
</script>
</body>
</html>
